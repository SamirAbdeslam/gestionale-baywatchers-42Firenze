services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bay
      POSTGRES_PASSWORD: bay
      POSTGRES_DB: baywatchers
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./scripts/init-dev-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bay -d baywatchers']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata-dev:
