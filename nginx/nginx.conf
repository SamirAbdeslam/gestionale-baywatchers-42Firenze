worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Query strings can contain the display token; omit them from access logs.
    log_format without_query '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log without_query;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/calendar text/csv;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream app {
        server app:3000;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;
        return 308 https://localhost:8443$request_uri;
    }

    server {
        listen 8443 ssl default_server;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 2m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        location /api/stream {
            proxy_pass http://app;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location /avatar/ {
            proxy_pass http://app;
            proxy_buffering off;
            proxy_cache off;
        }

        location /auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://app;
        }

        location / {
            proxy_pass http://app;
        }
    }
}
