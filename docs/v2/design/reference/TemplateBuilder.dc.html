<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Nuovo template · 42 Baywatchers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#0b1422}
a{color:#ff8a63}a:hover{color:#eef3fa}
</style>
</helmet>
<div style="min-height: 1160px; background: #0b1422; color: #eef3fa; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="border-bottom: 1px solid #2b3e5c">
    <div style="height: 4px; background: #ff6a3d"></div>
    <div style="max-width: 1360px; margin: 0 auto; padding: 0 40px; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap">
      <a href="#" style="display: inline-flex; align-items: center; gap: 8px; color: #eef3fa; text-decoration: none; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m11 18-6-6 6-6"></path></svg>
        Template
      </a>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9aabc4">bozza non salvata</span>
    </div>
  </header>

  <main style="flex: 1; max-width: 1360px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 32px 40px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end">
      <label style="flex: 2 1 360px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Nome del template
        <input type="text" value="Settimana esami" style="min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 2px solid #ff6a3d; background: #121f33; color: #eef3fa; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">
      </label>
      <label style="flex: 0 0 160px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Settimana
        <select style="min-height: 52px; padding: 0 12px; border-radius: 14px; border: 2px solid #2b3e5c; background: #121f33; color: #eef3fa; font-family: 'IBM Plex Mono', monospace; font-size: 16px"><option>W03</option></select>
      </label>
      <label style="flex: 3 1 360px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Descrizione
        <input type="text" value="Sorveglianze mattina e pomeriggio" style="min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 2px solid #2b3e5c; background: #121f33; color: #eef3fa; font: inherit; font-size: 15px; font-weight: 400">
      </label>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <section aria-label="Eventi del template" style="flex: 999 1 720px; min-width: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <h2 style="margin: 0; padding-bottom: 8px; border-bottom: 2px solid #2b3e5c; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #9aabc4">{{d.name}}</h2>
            <sc-for list="{{d.items}}" as="it" hint-placeholder-count="2">
              <button type="button" style="text-align: left; display: flex; align-items: stretch; padding: 0; border-radius: 12px; overflow: hidden; border: {{it.border}}; background: #121f33; color: #eef3fa; font: inherit; cursor: pointer">
                <span style="width: 8px; flex-shrink: 0; background: {{it.fill}}"></span>
                <span style="flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 3px">
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600">{{it.time}}</span>
                  <span style="font-size: 13px; font-weight: 600; line-height: 1.25">{{it.title}}</span>
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9aabc4">{{it.meta}}</span>
                </span>
              </button>
            </sc-for>
            <button type="button" style="min-height: 44px; border-radius: 12px; border: 1px dashed #2b3e5c; background: transparent; color: #9aabc4; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">+ Aggiungi</button>
          </div>
        </sc-for>
      </section>

      <aside aria-label="Modifica evento" style="flex: 1 1 320px; max-width: 360px; padding: 18px; border-radius: 18px; background: #121f33; border: 2px solid #ff6a3d; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800">Mercoledì · evento 2</h2>
          <button type="button" aria-label="Chiudi" style="width: 36px; height: 36px; border-radius: 999px; border: 1px solid #2b3e5c; background: transparent; color: #eef3fa; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </button>
        </div>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Titolo
          <input type="text" value="Sorveglianza esami (2 ore)" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 2px solid #2b3e5c; background: #0b1422; color: #eef3fa; font: inherit; font-size: 14px; font-weight: 400">
        </label>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Inizio
            <input type="time" value="14:00" style="min-height: 44px; box-sizing: border-box; padding: 0 10px; border-radius: 12px; border: 2px solid #2b3e5c; background: #0b1422; color: #eef3fa; font-family: 'IBM Plex Mono', monospace; font-size: 14px">
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Fine
            <input type="time" value="16:00" style="min-height: 44px; box-sizing: border-box; padding: 0 10px; border-radius: 12px; border: 2px solid #2b3e5c; background: #0b1422; color: #eef3fa; font-family: 'IBM Plex Mono', monospace; font-size: 14px">
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Posti
            <input type="number" value="4" style="min-height: 44px; box-sizing: border-box; padding: 0 10px; border-radius: 12px; border: 2px solid #2b3e5c; background: #0b1422; color: #eef3fa; font-family: 'IBM Plex Mono', monospace; font-size: 14px">
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Compenso
            <input type="number" value="200" style="min-height: 44px; box-sizing: border-box; padding: 0 10px; border-radius: 12px; border: 2px solid #2b3e5c; background: #0b1422; color: #eef3fa; font-family: 'IBM Plex Mono', monospace; font-size: 14px">
          </label>
        </div>
        <div style="display: flex; gap: 8px">
          <button type="button" style="flex: 1; min-height: 44px; border-radius: 999px; border: 0; background: #eef3fa; color: #0b1422; font: inherit; font-size: 14px; font-weight: 700">Aggiorna</button>
          <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #ff8f87; background: transparent; color: #ff8f87; font: inherit; font-size: 14px; font-weight: 600">Rimuovi</button>
        </div>
      </aside>
    </div>
  </main>

  <footer style="position: sticky; bottom: 0; border-top: 1px solid #2b3e5c; background: #0b1422">
    <div style="max-width: 1360px; margin: 0 auto; padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #9aabc4">10 eventi · 38 posti · 1800 ₳ totali</span>
      <div style="display: flex; gap: 10px">
        <a href="#" style="min-height: 48px; padding: 0 20px; display: inline-flex; align-items: center; border-radius: 999px; color: #9aabc4; font-size: 15px; font-weight: 600">Annulla</a>
        <button type="submit" style="min-height: 48px; padding: 0 26px; border-radius: 999px; border: 0; background: #ff6a3d; color: #0b1422; font: inherit; font-size: 15px; font-weight: 700">Salva template</button>
      </div>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1160}}'>
class Component extends DCLogic {
  renderVals() {
    const exam = '#3d3aa8', cluster = '#17a589';
    const it = (fill, time, title, meta, sel) => ({ fill, time, title, meta, border: sel ? '2px solid #ff6a3d' : '1px solid #2b3e5c' });
    const examA = (sel) => it(exam, '09:00–11:00', 'Sorveglianza esami (2 ore)', '4 posti · 200 ₳', false);
    return {
      days: [
        { name: 'Lunedì', items: [examA(), it(exam, '14:00–16:00', 'Sorveglianza esami (2 ore)', '4 posti · 200 ₳')] },
        { name: 'Martedì', items: [examA(), it(cluster, '16:00–18:00', 'Presenza cluster', '3 posti · 100 ₳')] },
        { name: 'Mercoledì', items: [examA(), it(exam, '14:00–16:00', 'Sorveglianza esami (2 ore)', '4 posti · 200 ₳', true)] },
        { name: 'Giovedì', items: [examA(), it(cluster, '16:00–18:00', 'Presenza cluster', '3 posti · 100 ₳')] },
        { name: 'Venerdì', items: [examA(), it(exam, '14:00–16:00', 'Sorveglianza esami (2 ore)', '4 posti · 200 ₳')] }
      ]
    };
  }
}
</script>
</body>
</html>
