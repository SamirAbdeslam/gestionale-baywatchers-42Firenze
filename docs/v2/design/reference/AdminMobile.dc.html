<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Admin mobile · 42 Baywatchers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#0b1422}
a{color:#ff8a63}a:hover{color:#eef3fa}
</style>
</helmet>
<div style="width: 390px; height: 1700px; box-sizing: border-box; background: #0b1422; color: #eef3fa; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="flex-shrink: 0">
    <div style="height: 4px; background: #ff6a3d"></div>
    <div style="height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between">
      <a href="#" aria-label="42 Baywatchers, calendario" style="color: #eef3fa; display: flex">
        <svg aria-hidden="true" viewBox="0 0 1480.71 120" style="height: 15px; width: auto; display: block"><g fill="currentColor" transform="translate(0 0) scale(0.357143) translate(-17 -79)"><path d="M193 79H281L105 255H281V415H193V327H17V255Z"></path><path d="M319 79H406L319 166Z"></path><path d="M407 79H495V167L407 255V343H319V255L407 167Z"></path><path d="M495 255V343H407Z"></path></g><g fill="currentColor" fill-rule="evenodd"><path d="M218.71 0H298.71L318.71 20V45L306.71 60L318.71 75V100L298.71 120H218.71ZM248.71 30H288.71V46H248.71ZM248.71 74H288.71V90H248.71Z"></path><path d="M332.71 120V30L362.71 0H432.71V120H402.71V82H362.71V120ZM362.71 30V52H402.71V30Z"></path><path d="M446.71 0H476.71V45H516.71V0H546.71V60L531.71 75H511.71V120H481.71V75H461.71L446.71 60Z"></path><path d="M560.71 0H590.71V90H615.71V30H645.71V90H670.71V0H700.71V100L680.71 120H580.71L560.71 100Z"></path><path d="M714.71 120V30L744.71 0H814.71V120H784.71V82H744.71V120ZM744.71 30V52H784.71V30Z"></path><path d="M828.71 0H928.71V30H893.71V120H863.71V30H828.71Z"></path><path d="M972.71 0H1038.71V30H972.71V90H1038.71V120H972.71L942.71 90V30Z"></path><path d="M1052.71 0H1082.71V45H1122.71V0H1152.71V120H1122.71V75H1082.71V120H1052.71Z"></path><path d="M1166.71 0H1256.71V30H1196.71V46H1241.71V74H1196.71V90H1256.71V120H1166.71Z"></path><path d="M1270.71 0H1350.71L1370.71 20V50L1354.71 66L1370.71 82V120H1340.71V94L1322.71 76H1300.71V120H1270.71ZM1300.71 30H1340.71V46H1300.71Z"></path><path d="M1404.71 0H1480.71V30H1414.71V46H1460.71L1480.71 66V100L1460.71 120H1384.71V90H1450.71V74H1404.71L1384.71 54V20Z"></path></g></svg>
      </a>
      <a href="#" aria-label="Apri il display TV" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #2b3e5c; color: #ff8a63; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
      </a>
    </div>
    <nav aria-label="Sezioni admin" style="display: flex; gap: 2px; overflow-x: auto; padding: 0 8px; border-bottom: 1px solid #2b3e5c">
      <sc-for list="{{sections}}" as="s" hint-placeholder-count="5">
        <a href="#" aria-current="{{s.current}}" style="padding: 12px 10px; font-size: 13px; font-weight: 700; text-decoration: none; color: {{s.fg}}; border-bottom: 3px solid {{s.rule}}; white-space: nowrap">{{s.label}}</a>
      </sc-for>
    </nav>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 12px; border-radius: 14px; background: #121f33; border: 2px solid #ff6a3d; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #ff8a63">Attiva</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800; line-height: 1">W03</span>
        <button type="button" style="min-height: 36px; border-radius: 999px; border: 0; background: #ff6a3d; color: #0b1422; font: inherit; font-size: 13px; font-weight: 700">Attiva W04</button>
      </div>
      <div style="padding: 12px; border-radius: 14px; background: #121f33; border: 1px solid #2b3e5c; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #9aabc4">Turni a persona</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800; line-height: 1">3</span>
        <button type="button" style="min-height: 36px; border-radius: 999px; border: 2px solid #eef3fa; background: transparent; color: #eef3fa; font: inherit; font-size: 13px; font-weight: 700">Modifica</button>
      </div>
    </div>

    <details style="border-radius: 14px; background: #121f33; border: 1px solid #2b3e5c">
      <summary style="min-height: 48px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 700; cursor: pointer">
        <span>Date del pool e display TV</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 400; color: #9aabc4">5 ott – 1 nov</span>
      </summary>
    </details>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; line-height: 1">Settimana 3</h1>
      <nav aria-label="Settimana da gestire" style="display: flex; gap: 4px">
        <sc-for list="{{weeks}}" as="w" hint-placeholder-count="4">
          <a href="#" aria-current="{{w.current}}" style="width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 2px solid {{w.border}}; background: {{w.bg}}; color: {{w.fg}}; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">{{w.code}}</a>
        </sc-for>
      </nav>
    </div>

    <button type="button" style="min-height: 52px; border-radius: 999px; border: 0; background: #ff6a3d; color: #0b1422; font: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      Nuovo evento
    </button>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #eef3fa">
        <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800">Lunedì 19</h2>
        <button type="button" aria-expanded="true" aria-label="Nascondi eventi di lunedì" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #2b3e5c; background: transparent; color: #eef3fa; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"></path></svg>
        </button>
      </div>

      <article style="border-radius: 16px; background: #121f33; border: 1px solid #2b3e5c; overflow: hidden">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #17a589; color: #03180f">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">08:30 → 10:30</span>
          <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em">Cluster</span>
        </div>
        <div style="padding: 12px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <h3 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700">Presenza cluster</h3>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9aabc4">100 ₳ · 2/2 · 1 presente</span>
            </div>
            <button type="button" aria-label="Azioni evento" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #2b3e5c; background: transparent; color: #eef3fa; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
            </button>
          </div>
          <sc-for list="{{people}}" as="p" hint-placeholder-count="2">
            <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 12px; background: #0b1422">
              <div style="display: flex; justify-content: space-between; align-items: center">
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; text-decoration: {{p.strike}}; color: {{p.fg}}">@{{p.login}}</span>
                <button type="button" aria-label="Rimuovi {{p.login}}" style="width: 36px; height: 36px; border-radius: 999px; border: 0; background: transparent; color: #9aabc4; display: flex; align-items: center; justify-content: center">
                  <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                </button>
              </div>
              <div role="group" aria-label="Presenza di {{p.login}}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #2b3e5c; border-radius: 999px; overflow: hidden">
                <button type="button" aria-pressed="{{p.present}}" style="min-height: 40px; border: 0; background: {{p.presentBg}}; color: {{p.presentFg}}; font: inherit; font-size: 13px; font-weight: 700">Presente</button>
                <button type="button" aria-pressed="{{p.absent}}" style="min-height: 40px; border: 0; background: {{p.absentBg}}; color: {{p.absentFg}}; font: inherit; font-size: 13px; font-weight: 700">Assente</button>
              </div>
            </div>
          </sc-for>
          <form style="margin: 0; display: flex; gap: 6px">
            <label style="flex: 1; display: flex; font-size: 0">Aggiungi partecipante
              <input type="text" placeholder="login intra" style="width: 100%; min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px dashed #2b3e5c; background: transparent; color: #eef3fa; font-family: 'IBM Plex Mono', monospace; font-size: 14px">
            </label>
            <button type="submit" aria-label="Aggiungi" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #2b3e5c; background: transparent; color: #eef3fa; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </form>
        </div>
      </article>
    </section>

    <sc-for list="{{collapsed}}" as="c" hint-placeholder-count="4">
      <div style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid #2b3e5c">
        <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800">{{c.title}}</h2>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9aabc4">{{c.summary}}</span>
          <button type="button" aria-expanded="false" aria-label="Mostra eventi di {{c.title}}" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #2b3e5c; background: transparent; color: #eef3fa; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
        </div>
      </div>
    </sc-for>

    <button type="button" style="min-height: 48px; border-radius: 999px; border: 2px solid #ff8f87; background: transparent; color: #ff8f87; font: inherit; font-size: 14px; font-weight: 700">Svuota settimana</button>
  </main>

  <nav aria-label="Principale" style="flex-shrink: 0; height: 76px; border-top: 1px solid #2b3e5c; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9aabc4; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 11h18"></path></svg>
      Calendario
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9aabc4; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      Profilo
    </a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #ff8a63; text-decoration: none; font-size: 12px; font-weight: 700; border-top: 3px solid #ff6a3d; margin-top: -1px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v6c0 4 3.5 7 8 8 4.5-1 8-4 8-8V7z"></path></svg>
      Admin
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    const person = (login, absent) => ({
      login, strike: absent ? 'line-through' : 'none', fg: absent ? '#9aabc4' : '#eef3fa',
      present: absent ? 'false' : 'true', absent: absent ? 'true' : 'false',
      presentBg: absent ? 'transparent' : '#0f3a33', presentFg: absent ? '#9aabc4' : '#5ee0b5',
      absentBg: absent ? '#43191a' : 'transparent', absentFg: absent ? '#ff8f87' : '#9aabc4'
    });
    return {
      sections: ['Settimane', 'Template', 'Partecipanti', 'Whitelist', 'Log'].map((label, i) => ({
        label, current: i === 0 ? 'page' : 'false', fg: i === 0 ? '#eef3fa' : '#9aabc4', rule: i === 0 ? '#ff6a3d' : 'transparent'
      })),
      weeks: ['W1', 'W2', 'W3', 'W4'].map((code, i) => ({
        code, current: i === 2 ? 'page' : 'false',
        border: i === 2 ? '#eef3fa' : '#2b3e5c', bg: i === 2 ? '#eef3fa' : 'transparent', fg: i === 2 ? '#0b1422' : '#eef3fa'
      })),
      people: [person('acosta'), person('fneri', true)],
      collapsed: [
        { title: 'Martedì 20', summary: '2 eventi' },
        { title: 'Mercoledì 21', summary: '2 eventi' },
        { title: 'Giovedì 22', summary: '1 evento' },
        { title: 'Venerdì 23', summary: '2 eventi' },
        { title: 'Sabato 24', summary: 'nessuno' },
        { title: 'Domenica 25', summary: 'nessuno' }
      ]
    };
  }
}
</script>
</body>
</html>
